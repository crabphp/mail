name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP ${{ matrix.php }} / framework ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        framework: ['v0.7.0', 'main']
    defaults:
      run:
        working-directory: mail
    steps:
      - uses: actions/checkout@v4
        with:
          path: mail
      # Composer reads the lowest supported framework release or main from the sibling path repository.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          ref: ${{ matrix.framework }}
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer format:check
      - run: composer lint
      - run: composer test
